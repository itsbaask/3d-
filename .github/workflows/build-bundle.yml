name: Build DOLA Shorts World-Class ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate both packages and reference images
        run: |
          python scripts/quality_gate.py
          python scripts/build_bundle.py
          python -m zipfile -t dola-shorts-world-class-bundle.zip
          python -m zipfile -t dola-shorts-world-class-skill.zip
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile("dola-shorts-world-class-skill.zip")
          assert "SKILL.md" in z.namelist()
          text = z.read("SKILL.md").decode("utf-8")
          assert text.splitlines()[:2] == ["---", "name: dola-shorts-world-class"]
          print("Installer package layout/frontmatter: PASS")
          PY
      - name: Upload portable project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dola-shorts-world-class-bundle
          path: dola-shorts-world-class-bundle.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload installer-ready skill ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dola-shorts-world-class-skill
          path: dola-shorts-world-class-skill.zip
          if-no-files-found: error
          retention-days: 30
